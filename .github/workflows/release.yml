name: Build & Release APK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # ── Production signing (configure secrets to enable) ──────────────────────
      # 1. Generate keystore:  keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias hdrezka
      # 2. Add to GitHub → Settings → Secrets and variables → Actions:
      #      KEYSTORE_BASE64      base64 -w0 release.jks
      #      KEY_STORE_PASSWORD   keystore password
      #      KEY_PASSWORD         key password
      #      KEY_ALIAS            hdrezka
      # 3. Uncomment the two steps below:
      #
      # - name: Decode keystore
      #   run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
      #
      # - name: Write key.properties
      #   run: |
      #     cat > android/key.properties <<EOF
      #     storePassword=${{ secrets.KEY_STORE_PASSWORD }}
      #     keyPassword=${{ secrets.KEY_PASSWORD }}
      #     keyAlias=${{ secrets.KEY_ALIAS }}
      #     storeFile=../app/release.jks
      #     EOF

      # ── CI debug keystore (used when production secrets are not configured) ────
      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/ci-debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass android -keypass android \
            -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BUILD=$(echo "$VERSION" | tr -d '.')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build }}"

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/hdrezka-tv-${{ steps.version.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HDRezka TV ${{ steps.version.outputs.version }}"
          body: |
            ## Что нового

            <!-- Отредактируйте описание релиза на GitHub после публикации -->
          files: build/app/outputs/flutter-apk/hdrezka-tv-${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
